services:
  mission-control:
    environment:
      OPENCLAW_BIN: "/app/openclaw-proxy.js"
      OPENCLAW_HOME: "/openclaw-home"
      OPENCLAW_WORKSPACE_DIR: "/openclaw-workspace"
      OPENCLAW_MEMORY_DIR: "/openclaw-workspace/memory"
    volumes:
      - ./openclaw-proxy.js:/app/openclaw-proxy.js:ro
      - openclaw-config:/openclaw-home:ro
      - openclaw-workspace:/openclaw-workspace:ro

  ocv-heartbeat-relay:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/app/heartbeat-relay.js"]
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      MC_URL: "http://192.168.1.32:4000"
      MC_API_KEY: "${MC_HEARTBEAT_API_KEY}"
      GW_URL: "http://host-gateway:18789"
      GW_TOKEN: "${OPENCLAW_GATEWAY_TOKEN}"
    volumes:
      - ./heartbeat-relay.js:/app/heartbeat-relay.js:ro
    depends_on:
      - mission-control
    networks:
      - default

volumes:
  openclaw-config:
    external: true
    name: openclaw-config
  openclaw-workspace:
    external: true
    name: openclaw-workspace
